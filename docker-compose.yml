services:
  velvet-room:
    build: .
    container_name: velvet-room
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-4173}:4173"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
